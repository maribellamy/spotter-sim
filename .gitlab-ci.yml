lint:
  image: registry.gitlab.com/pipeline-components/flake8:latest
  script:
    - flake8 --verbose --ignore="E501" .

test:
  image: ubuntu:latest
  artifacts:
    paths:
      - data
      - plots
    expire_in: 1 week
  script:
    - apt-get update
    - apt-get install -y python3 python3-pip python3-venv
    - snap install root-framework
    - snap run root-framework
    - python3 -m venv venv
    - source venv/bin/activate
    - pip3 install -r requirements.txt
    - python3 -m spotter.fetcher
    - python3 -m spotter.plotter
