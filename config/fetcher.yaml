dates:
  start: "2023-01-01"
  end: "2024-09-28"

step: "Execute"

flavors:
  legacy_default:
    tag: "tracking"
    points:
      - { name: "pixel_clusterization", map: "ITkPixelClusterization" }
      - { name: "strip_clusterization", map: "ITkStripClusterization" }
      - { name: "clusterization", sum: ["pixel_clusterization", "strip_clusterization"] }
      - { name: "space_point_formation", map: "ITkSiTrackerSpacePointFinder" }
      - { name: "track_finding", map: "ITkSiSpTrackFinder" }

  legacy_fast:
    tag: "fasttracking"
    points:
      - { name: "pixel_clusterization", map: "ITkPixelClusterization" }
      - { name: "strip_clusterization", map: "ITkStripClusterization" }
      - { name: "clusterization", sum: ["pixel_clusterization", "strip_clusterization"] }
      - { name: "space_point_formation", map: "ITkSiTrackerSpacePointFinder" }
      - { name: "track_finding", map: "ITkSiSpTrackFinder" }

  acts_default:
    tag: "actstracking"
    points:
      - { name: "pixel_clusterization", map: ".*PixelClusterizationAlg" }
      - { name: "strip_clusterization", map: ".*StripClusterizationAlg" }
      - { name: "clusterization", sum: ["pixel_clusterization", "strip_clusterization"] }
      - { name: "pixel_space_point_formation", map: ".*PixelSpacePointFormation.*" }
      - { name: "strip_space_point_formation", map: ".*StripSpacePointFormation.*" }
      - { name: "space_point_formation", sum: ["pixel_space_point_formation", "strip_space_point_formation"] }
      - { name: "pixel_seeding", map: ".*PixelSeedingAlg" }
      - { name: "strip_seeding", map: ".*StripSeedingAlg" }
      - { name: "seeding", sum: ["pixel_seeding", "strip_seeding"] }
      - { name: "ckf", map: ".*TrackFindingAlg" }
      - { name: "track_finding", sum: ["seeding", "ckf"] }

  acts_fast:
    tag: "actsfasttracking"
    points:
      - { name: "pixel_clusterization", map: ".*PixelClusterizationAlg" }
      - { name: "strip_clusterization", map: ".*StripClusterizationAlg" }
      - { name: "clusterization", sum: ["pixel_clusterization", "strip_clusterization"] }
      - { name: "pixel_space_point_formation", map: ".*PixelSpacePointFormation.*" }
      - { name: "space_point_formation", sum: ["pixel_space_point_formation"] }
      - { name: "pixel_seeding", map: ".*PixelSeedingAlg" }
      - { name: "seeding", sum: ["pixel_seeding"] }
      - { name: "ckf", map: ".*TrackFindingAlg" }
      - { name: "track_finding", sum: ["seeding", "ckf"] }
