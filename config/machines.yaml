# The SPOT machines, from the "running on" line and the PerfMonMTSvc system
# information in the logs.
#
# HS23 is HEPScore23, the HEPiX benchmark of a whole machine; higher is faster.
# `per_core` is HS23 divided by the number of online CPUs (logical cores with
# SMT on). The values are the CERN measurements for the same CPU model and core
# configuration from https://w3.hepix.org/benchmarking/scores_HS23.html,
# not measurements of the SPOT machines themselves. HS23 is information only:
# it does not predict the single-threaded SPOT times (the per-core value with
# SMT on is wrong by about 45%, and the ratio differs between the algorithms).
#
# `start` and `end` (both optional and inclusive) select the period of a
# configuration, because aiatlasbm001 ran with SMT off in 2023/24 and with SMT
# on from 2025-11-06.
#
# The plots show the CPU times on the scale of the reference machine
# (`reference: true`). `scale` is the CPU time on a machine divided by the CPU
# time on the reference machine for the same code, measured from the nightlies
# around the moves between the machines (python -m spotter.checks machine-scale
# prints the blocks below). `default` applies to the points without their own
# factor, `point` to that point of every flavor, and `flavor.point` to that
# point of one flavor (the tool adds one if the flavor deviates by more than 2%). The plotter and the checks divide the CPU times by
# these factors.

machines:
  - host: aiatlasbm001
    end: "2024-12-31"
    cpu: "AMD EPYC 7302"
    cores: "2x16 cores, SMT off"
    hs23: 768.2
    per_core: 24.0
    # aiatlasbm001 (..2024-12-31): factors from the moves on 2024-02-27
    # the moves include a platform change (centos7-gcc11 -> el9-gcc13), so the factors include it
    # python -m spotter.checks machine-scale --window 7 --min-points 3
    scale:
      default: 1.333
      ambiguity: 1.333
      ambiguity_score: 1.225
      ambiguity_solver: 1.348
      ckf: 1.313
      clusterization: 1.390
      full_track_chain: 1.332
      pixel_clusterization: 1.395
      pixel_seeding: 1.296
      pixel_space_point_formation: 1.456
      seeding: 1.278
      space_point_formation: 1.521
      strip_clusterization: 1.372
      strip_seeding: 1.200
      strip_space_point_formation: 1.461
      track_finding: 1.302
      acts_default.clusterization: 1.325
      acts_default.pixel_clusterization: 1.285
      acts_default.space_point_formation: 1.459
      acts_default.strip_clusterization: 1.431
      acts_legacy.clusterization: 1.325
      acts_legacy.pixel_clusterization: 1.285
      acts_legacy.space_point_formation: 1.459
      acts_legacy.strip_clusterization: 1.431
      legacy_default.clusterization: 1.472
      legacy_default.pixel_clusterization: 1.528
      legacy_default.space_point_formation: 1.475
      legacy_default.strip_clusterization: 1.320
      legacy_default.track_finding: 1.270
      legacy_fast.clusterization: 1.445
      legacy_fast.full_track_chain: 1.379
      legacy_fast.pixel_clusterization: 1.504
      legacy_fast.space_point_formation: 1.705
      legacy_fast.strip_clusterization: 1.309

