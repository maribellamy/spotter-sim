# Public results and the last nightly that they contain. A plot shows each
# reference as a dashed line at `date`.
references:
  # "The starting date for the plot is 15 February 2024, using Athena 24.0.24
  # (ACTS v32.0.2)"; "The last data point on the plot corresponds to the running
  # time obtained on 10 September 2024" (Athena 25.0.16, ACTS v36.2.1)
  - date: "2024-09-10"
    name: "ATL-PHYS-PUB-2024-017"
    range: "2024-02-15 to 2024-09-10, Athena 24.0.24 to 25.0.16"
    url: "https://cds.cern.ch/record/2912217"
  # figure: "End date: October 2025, Athena 25.0.44 (ACTS v44.0.1)"; 25.0.44 is
  # in main from nightly 2025-10-15, and the x axis of the figure ends at about
  # 2025-10-15 (read from the figure, +-2 days)
  - date: "2025-10-15"
    name: "PLOTS-IDTR-2025-06"
    range: "2024-09 to about 2025-10-15, Athena 25.0.16 to 25.0.44, fast configuration, HS23 x s"
    url: "https://atlas.web.cern.ch/Atlas/GROUPS/PHYSICS/PLOTS/IDTR-2025-06/"
