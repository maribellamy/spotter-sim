# Annotations for all plots.
#
# Each annotation has a `date` (the first nightly that shows the change), a
# `text`, the `flavors` and the `points` that it affects. A plot shows an
# annotation if the flavor and the point of a plotted line match, with a
# marker on every matching line. An annotation of a part also belongs to the
# sums that contain it (the `sum` points of fetcher.yaml): an annotation of
# ckf shows on a plot of track_finding and of full_track_chain too.
#
# Nightly D contains the merges into athena main up to about 21:00 Zurich time
# on day D. The platform changes (for example el9-gcc13 on 2024-02-27) and the
# changes of the SPOT machine are not in this file: the CPU times are
# normalized to one machine (machines.yaml), so the plots do not mark them.
# The machine explains the infrastructure steps: aiatlasbm006 is about 20-25%
# faster than aiatlasbm001 (2024-02-27 to 006, 2025-11-06 to 001, 2026-07-21 to 006).
#
# The MRs were checked against the athena history. `(unclear)` marks an
# annotation with low confidence.

acts_both: &acts_both [acts_default, acts_legacy]
acts_all: &acts_all [acts_default, acts_fast, acts_legacy]
acts_default_fast: &acts_default_fast [acts_default, acts_fast]
legacy_all: &legacy_all [legacy_default, legacy_fast]
all: &all [legacy_default, legacy_fast, acts_default, acts_fast, acts_legacy]

